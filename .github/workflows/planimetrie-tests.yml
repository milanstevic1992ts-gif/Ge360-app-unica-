name: Test GE360 Planimetrie

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - 'feature/planimetrie/**'
      - '.github/workflows/planimetrie-tests.yml'

permissions:
  contents: read

jobs:
  test-planimetrie:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile and test Planimetrie
        run: gradle :feature:planimetrie:testDebugUnitTest --stacktrace
