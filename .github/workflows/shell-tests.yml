name: Test GE360 Shell

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'feature/home/**'
      - 'feature/planimetrie/**'
      - '.github/workflows/shell-tests.yml'

permissions:
  contents: read

jobs:
  test-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate resources, compile shell and run safety tests
        run: gradle :app:processDebugResources :app:compileDebugKotlin :app:testDebugUnitTest --stacktrace
