name: Build GE360 APK

on:
  workflow_dispatch:
  push:
    branches:
      - feat/ge360-design-accessibility-20261103
    paths:
      - '.github/build-apk-trigger'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify static GE360 contracts
        run: |
          for f in scripts/verify-*.sh; do bash "$f"; done

      - name: Build installable debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Run critical module tests
        id: tests
        continue-on-error: true
        run: |
          gradle \
            :core:common:testDebugUnitTest \
            :core:backup:testDebugUnitTest \
            :feature:agenda:testDebugUnitTest \
            :feature:giornata:testDebugUnitTest \
            :feature:attrezzi:testDebugUnitTest \
            :feature:planimetrie:testDebugUnitTest \
            :feature:preventivi:testDebugUnitTest \
            :feature:fisco:testDebugUnitTest \
            :feature:spese:testDebugUnitTest \
            --stacktrace


      - name: Verify APK structure and checksum
        if: success()
        run: |
          APK=$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n1)
          test -n "$APK"
          ls -lh "$APK"
          sha256sum "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q 'classes.dex'
          unzip -l "$APK" | grep -q 'AndroidManifest.xml'
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)
          "$BT/aapt" dump badging "$APK" | head -n 8
          "$BT/apksigner" verify "$APK"

      - name: Upload installable APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GE360-debug-installabile
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Enforce all unit tests passed
        if: steps.tests.outcome != 'success'
        run: exit 1
