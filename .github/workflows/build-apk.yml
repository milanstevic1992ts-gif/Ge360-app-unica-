name: Build GE360 APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - '.github/build-apk-trigger'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin

          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify unsigned APK structure
        if: success()
        run: |
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n1)
          test -n "$APK"
          ls -lh "$APK"
          sha256sum "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q 'classes.dex'
          unzip -l "$APK" | grep -q 'AndroidManifest.xml'
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)
          "$BT/aapt" dump badging "$APK" | head -n 8

      - name: Prepare official Android signing tools
        if: success()
        run: |
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)
          mkdir -p signing-tools/lib64 signing-tools/lib
          cp "$BT/zipalign" signing-tools/
          cp "$BT/apksigner" signing-tools/
          cp "$BT/lib/apksigner.jar" signing-tools/lib/
          if [ -d "$BT/lib64" ]; then cp -a "$BT/lib64/." signing-tools/lib64/; fi
          chmod +x signing-tools/zipalign signing-tools/apksigner

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GE360-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Android signing tools
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-signing-tools-linux
          path: signing-tools/
          if-no-files-found: error
          retention-days: 1
